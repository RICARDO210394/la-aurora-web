<!doctype html>
<!-- La Aurora Web · sitio de noticias, deportes, en vivo y La Aurora Radio -->
<!-- Archivo único: súbelo como index.html a GitHub Pages o Netlify -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>La Aurora Web</title>
<meta name="description" content="Noticias, deportes, transmisiones en vivo y La Aurora Radio desde La Aurora, Daule.">
<meta name="theme-color" content="#E3342B">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Concepto: identidad La Aurora (blanco, negro, rojo). Barra de marca blanca con logo, cabina de radio negra, acentos rojos. Barra de señal arriba, portada tipo titular, rejilla de notas, cabina de radio con dial. */
:root{
  --bg:#FFFFFF; --surface:#F6F6F6; --ink:#111111; --muted:#5C5C5C; --line:#E2E2E2;
  --dawn:#E3342B; --dawn-ink:#FFFFFF; --field:#111111; --live:#E3342B; --band:#111111; --band-ink:#FFFFFF;
  --brandbar:#FFFFFF; --brandbar-ink:#111111;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --surface:#1A1A1A; --ink:#F2F2F2; --muted:#A6A6A6; --line:#2C2C2C;
  --dawn:#FF5A4F; --dawn-ink:#FFFFFF; --field:#F2F2F2; --live:#FF5A4F; --band:#000000; --band-ink:#F2F2F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#1A1A1A; --ink:#F2F2F2; --muted:#A6A6A6; --line:#2C2C2C;
  --dawn:#FF5A4F; --dawn-ink:#FFFFFF; --field:#F2F2F2; --live:#FF5A4F; --band:#000000; --band-ink:#F2F2F2; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);padding-bottom:84px}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dawn);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font:700 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--r);padding:10px 16px;font-weight:700;cursor:pointer;background:var(--dawn);color:var(--dawn-ink);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.danger{background:var(--live);color:#fff}

/* Barra superior y navegación */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--brandbar)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--brandbar);color:var(--brandbar-ink);border-bottom:4px solid var(--dawn)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--band-ink)}
.brand img.logo{height:46px;width:auto}
.brand .web{font:400 20px/1 var(--f-display);background:var(--dawn);color:#fff;padding:5px 8px 4px;border-radius:3px;letter-spacing:.04em}
.brand b{font:400 30px/1 var(--f-display);letter-spacing:.01em}
.brand span{font:700 11px/1 var(--f-mono);letter-spacing:.14em;color:var(--dawn)}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{padding:8px 12px;border-radius:var(--r);text-decoration:none;font-weight:700;font-size:15px;opacity:.82}
nav.main a{color:var(--brandbar-ink)}
nav.main a:hover{opacity:1;background:rgba(0,0,0,.05)}
nav.main a.on{opacity:1;box-shadow:inset 0 -3px 0 var(--dawn)}
.signal{background:var(--live);color:#fff;font:700 13px/1 var(--f-mono);letter-spacing:.06em}
.signal .wrap{display:flex;align-items:center;gap:12px;min-height:38px;flex-wrap:wrap}
.signal a{color:#fff;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot,.bars i{animation:none!important}}

/* Portada */
.hero{padding-block:32px 8px}
.hero-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
.lead{position:relative;border-radius:var(--r);overflow:hidden;background:var(--band);color:var(--band-ink);min-height:380px;display:flex;align-items:flex-end;cursor:pointer}
.lead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.lead .txt{position:relative;padding:28px;min-width:0}
.lead h1{font:400 clamp(30px,4.6vw,54px)/1.02 var(--f-display);margin-top:10px}
.lead p{max-width:60ch;opacity:.9;margin:12px 0 0}
.side-list{display:flex;flex-direction:column;gap:0;border-top:3px solid var(--ink)}
.side-item{padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.side-item h3{font-size:18px;line-height:1.25;margin-top:6px}
.side-item:hover h3{color:var(--dawn)}
.tag{display:inline-block;font:700 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:3px;background:var(--dawn);color:var(--dawn-ink)}
.tag.dep{background:var(--ink);color:var(--bg)}
.meta{font:500 12px/1.3 var(--f-mono);color:var(--muted)}

section.block{padding-block:40px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font:400 clamp(30px,4vw,44px)/1 var(--f-display);letter-spacing:.01em}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line)}
.card .ph{aspect-ratio:16/9;background:linear-gradient(135deg,var(--band),var(--dawn));max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:19px;line-height:1.25}
.card p{margin:0;color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card:hover h3{color:var(--dawn)}
.empty{padding:32px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted)}

/* En vivo */
.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.player{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.player .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.player .hd b{font:400 22px/1 var(--f-display);letter-spacing:.02em}
.frame{aspect-ratio:16/9;background:var(--band);color:var(--band-ink);display:grid;place-items:center;text-align:center;max-width:100%}
.frame iframe{width:100%;height:100%;border:0;display:block}
.frame .off{padding:20px;opacity:.85}
.pill{font:700 11px/1 var(--f-mono);letter-spacing:.1em;padding:6px 9px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted)}
.pill.on{background:var(--live);border-color:var(--live);color:#fff}

/* Radio */
.radio{background:var(--band);color:var(--band-ink);border-radius:var(--r);padding:32px;display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center}
.disc{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--band) 0 16%,var(--dawn) 17% 19%,#262626 20% 100%);display:grid;place-items:center;position:relative;flex:none}
.disc button{width:76px;height:76px;border-radius:50%;border:0;background:var(--dawn);color:var(--dawn-ink);cursor:pointer;display:grid;place-items:center}
.disc.play{animation:spin 8s linear infinite}
.disc.play button{animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.radio h2{font:400 clamp(34px,5vw,58px)/1 var(--f-display)}
.radio .freq{font:700 14px/1 var(--f-mono);letter-spacing:.12em;color:var(--dawn)}
.bars{display:flex;gap:3px;align-items:flex-end;height:28px;margin-top:14px}
.bars i{width:5px;background:var(--dawn);height:30%;border-radius:2px}
.playing .bars i{animation:eq 900ms ease-in-out infinite}
.bars i:nth-child(2n){animation-delay:-.3s}.bars i:nth-child(3n){animation-delay:-.6s}
@keyframes eq{50%{height:100%}}
.vol{display:flex;align-items:center;gap:10px;margin-top:16px;font:500 13px var(--f-mono)}
.vol input{accent-color:var(--dawn);width:160px;max-width:100%}
.caster-slot{margin-top:18px;background:#fff;border-radius:var(--r);overflow:hidden;min-height:150px;max-width:640px}
.caster-slot .cstrEmbed{width:100%}
.sched{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.slot .t{font:700 13px/1 var(--f-mono);color:var(--dawn);font-variant-numeric:tabular-nums}
.slot b{display:block;margin-top:6px}

/* Mini reproductor fijo */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--band);color:var(--band-ink);border-top:3px solid var(--dawn);padding-bottom:env(safe-area-inset-bottom,0px)}
.mini .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.mini .pb{width:42px;height:42px;border-radius:50%;border:0;background:var(--dawn);color:var(--dawn-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.mini .info{min-width:0;flex:1}
.mini .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .info span{font:500 12px var(--f-mono);opacity:.75}

/* Artículo */
dialog{border:0;border-radius:var(--r);padding:0;max-width:760px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(6,13,22,.7)}
.art img{width:100%;aspect-ratio:16/9;object-fit:cover}
.art .bd{padding:24px 28px 32px}
.art h1{font:400 clamp(28px,4vw,42px)/1.05 var(--f-display);margin:12px 0}
.art .body{white-space:pre-wrap;max-width:65ch}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--band);color:var(--band-ink);cursor:pointer;font-size:20px}

/* Auspiciantes */
.spons{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.sp{background:var(--brandbar);border:1px solid var(--line);border-radius:var(--r);aspect-ratio:3/2;display:grid;place-items:center;padding:16px;text-decoration:none;color:#111;max-width:100%;transition:transform .15s}
.sp:hover{transform:translateY(-2px);border-color:var(--dawn)}
.sp img{max-height:100%;max-width:100%;object-fit:contain}
.sp b{font-size:15px;text-align:center}
.cta{margin-top:20px;background:var(--band);color:var(--band-ink);border-radius:var(--r);padding:28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;border-left:8px solid var(--dawn)}
.cta h3{font:400 clamp(28px,4vw,44px)/1 var(--f-display);letter-spacing:.01em}
.cta h3 span{color:var(--dawn)}
.cta p{margin:8px 0 0;opacity:.85;max-width:55ch}
.cta .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.cta .num{font:700 15px var(--f-mono);user-select:all}
@media (max-width:700px){.cta{grid-template-columns:1fr}}
footer{background:var(--band);color:var(--band-ink);margin-top:40px}
footer .wrap{padding-block:32px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer .brand b{font-size:24px}
footer small{opacity:.7}

/* Panel admin */
.admin{padding-block:32px}
.admin h2{font:400 36px/1 var(--f-display)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.form{display:grid;gap:14px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:6px;font-weight:700;font-size:14px;min-width:0}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],input[type=password],input[type=time],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg)}
textarea{min-height:180px;resize:vertical}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--live)}
.list{display:grid;gap:8px;margin-top:16px}
.li{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:var(--r);flex-wrap:wrap}
.li .tt{flex:1;min-width:0}
.li .tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-left:3px solid var(--dawn);padding:10px 14px;border-radius:0 var(--r) var(--r) 0}
.note ol{margin:6px 0 0;padding-left:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:90}

@media (max-width:860px){
  .hero-grid,.live-grid{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .radio{grid-template-columns:1fr;justify-items:center;text-align:center}
  .vol{justify-content:center}
  .bars{justify-content:center}
}
@media (max-width:560px){
  .brand img.logo{height:36px}
  .grid,.form .row{grid-template-columns:1fr}
  .lead{min-height:300px}
  .brand b{font-size:26px}
  nav.main a{padding:8px 9px;font-size:14px}
  .disc{width:150px;height:150px}
}
</style>
</head>

let DB=null, state=JSON.parse(JSON.stringify(SEED));
const useFirebase=!!FIREBASE_CONFIG.projectId;

function loadLocal(){try{const s=localStorage.getItem(LS);if(s)state=Object.assign(JSON.parse(JSON.stringify(SEED)),JSON.parse(s));}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){toast('No se pudo guardar en este navegador');}}

async function initData(){
  if(!useFirebase){loadLocal();render();return;}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);DB=firebase.firestore();
    DB.collection('site').doc('config').onSnapshot(d=>{
      if(d.exists){const c=d.data();if(c.live)state.live=c.live;if(c.radio)state.radio=c.radio;if(c.pin)state.pin=c.pin;if(c.sponsors)state.sponsors=c.sponsors;}
      else DB.collection('site').doc('config').set({live:SEED.live,radio:SEED.radio,sponsors:SEED.sponsors,pin:DEFAULT_PIN});
      render();
    });
    DB.collection('posts').orderBy('date','desc').onSnapshot(q=>{state.posts=q.docs.map(x=>({id:x.id,...x.data()}));render();});
  }catch(e){console.error(e);loadLocal();render();}
}
async function saveConfig(){
  if(DB){await DB.collection('site').doc('config').set({live:state.live,radio:state.radio,sponsors:state.sponsors,pin:state.pin});}
  else saveLocal();
}
async function savePost(p){
  if(DB){const {id,...rest}=p;if(id&&!id.startsWith('new'))await DB.collection('posts').doc(id).set(rest);else await DB.collection('posts').add(rest);}
  else{if(!p.id||p.id.startsWith('new'))p.id='p'+Date.now();const i=state.posts.findIndex(x=>x.id===p.id);if(i>=0)state.posts[i]=p;else state.posts.unshift(p);saveLocal();}
}
async function deletePost(id){
  if(DB)await DB.collection('posts').doc(id).delete();
  else{state.posts=state.posts.filter(p=>p.id!==id);saveLocal();}
}

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<60)return `hace ${Math.max(m,1)} min`;const h=Math.round(m/60);if(h<24)return `hace ${h} h`;return new Date(t).toLocaleDateString('es-EC',{day:'numeric',month:'short',year:'numeric'});}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
const sorted=()=>[...state.posts].sort((a,b)=>b.date-a.date);
const tagOf=c=>c==='deportes'?'<span class="tag dep">Deportes</span>':'<span class="tag">Noticias</span>';

/* Enlaces de YouTube y Facebook → reproductores incrustados */
function ytEmbed(v,channel){
  v=(v||'').trim();
  if(v){const m=v.match(/(?:v=|youtu\.be\/|live\/|embed\/|shorts\/)([\w-]{11})/);const id=m?m[1]:(/^[\w-]{11}$/.test(v)?v:'');if(id)return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1`;}
  if(channel&&channel.trim().startsWith('UC'))return `https://www.youtube.com/embed/live_stream?channel=${channel.trim()}&autoplay=1&mute=1`;
  return '';
}
function fbEmbed(u){u=(u||'').trim();if(!u)return '';return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u)}&show_text=false&autoplay=true&mute=true`;}

function cards(list){

    <article class="card" data-open="${esc(p.id)}" tabindex="0">
      <div class="ph">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy">`:''}</div>
      <div class="bd">${tagOf(p.cat)}<h3>${esc(p.title)}</h3><p>${esc(p.summary||'')}</p><div class="meta" style="margin-top:auto">${ago(p.date)}</div></div>
    </article>`).join('')}</div>`;
}
function listSection(cat,name,limit){
  const list=sorted().filter(p=>p.cat===cat);

    <div class="sec-head"><h2>${name}</h2>${limit?`<a href="#${cat}" class="btn small ghost">Ver todas</a>`:''}</div>
    ${cards(limit?list.slice(0,limit):list)}

}

}

/* Comprime la foto para que cargue rápido */
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1100,s=Math.min(1,max/im.width);const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72));};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
let pendingImg=null, pendingLogo=null;
function compressLogo(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,320/im.width,200/im.height);const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'));};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

  $('#loginF')?.addEventListener('submit',e=>{e.preventDefault();if($('#pinIn').value===state.pin){authed=true;try{sessionStorage.setItem('law_auth','1')}catch(e){}render();}else toast('Clave incorrecta');});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab;editing=null;render();});
  $('#pFile')?.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;pendingImg=await compress(f);$('#pPrev').innerHTML=`<img src="${pendingImg}" alt="" style="max-height:160px;border-radius:6px">`;});
  $('#postF')?.addEventListener('submit',async e=>{e.preventDefault();
    const base=editing||{id:'new',date:Date.now()};
    const img=pendingImg||$('#pImg').value.trim()||(base.img&&base.img.startsWith('data:')?base.img:'');
    const p={...base,cat:$('#pCat').value,title:$('#pTitle').value.trim(),summary:$('#pSum').value.trim(),body:$('#pBody').value,img,featured:$('#pFeat').checked};
    if(p.featured)for(const x of state.posts)if(x.id!==p.id&&x.featured){x.featured=false;if(DB)await savePost(x);}
    await savePost(p);pendingImg=null;editing=null;toast('Nota publicada');render();});
  $('#cancelEd')?.addEventListener('click',()=>{editing=null;render();});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=state.posts.find(p=>p.id===b.dataset.edit);pendingImg=null;render();scrollTo(0,0);});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(b.dataset.armed){await deletePost(b.dataset.del);toast('Nota borrada');render();}else{b.dataset.armed='1';b.textContent='¿Confirmar?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Borrar';}},3000);}});
  $('#liveF')?.addEventListener('submit',async e=>{e.preventDefault();state.live={on:$('#lOn').checked,title:$('#lTitle').value.trim(),youtube:$('#lYt').value.trim(),ytChannel:$('#lYtC').value.trim(),facebook:$('#lFb').value.trim(),fbPage:$('#lFbP').value.trim(),ytPage:$('#lYtP').value.trim()};await saveConfig();toast(state.live.on?'Transmisión EN VIVO activada':'Transmisión guardada');render();});
  $('#radioF')?.addEventListener('submit',async e=>{e.preventDefault();
    const sch=$('#rSched').value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a[0]&&a[1]).map(a=>({t:a[0],n:a[1],h:a[2]||''}));
    const cc=$('#rCaster').value;const tk=(cc.match(/data-publicToken="([\w-]+)"/i)||[])[1]||'';const ch=(cc.match(/data-channelId="([\w-]+)"/i)||[])[1]||'';
    if(cc.trim()&&!tk){toast('No encontré el código de Caster.fm. Cópialo completo desde Widgets.');return;}
    state.radio={casterToken:tk,casterChannel:ch,onAir:$('#rOn').checked,stream:$('#rStream').value.trim(),program:$('#rProg').value.trim(),host:$('#rHost').value.trim(),freq:$('#rFreq').value.trim(),schedule:sch};
    await saveConfig();setupAudio();toast('Radio guardada');render();});
  const S=state.sponsors=state.sponsors||JSON.parse(JSON.stringify(SEED.sponsors));S.list=S.list||[];
  $('#sFile')?.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;pendingLogo=await compressLogo(f);$('#sPrev').innerHTML=`<img src="${pendingLogo}" alt="" style="max-height:90px;background:#fff;padding:6px;border-radius:6px">`;});
  $('#spF')?.addEventListener('submit',async e=>{e.preventDefault();S.list.push({name:$('#sName').value.trim(),url:$('#sUrl').value.trim(),img:pendingLogo||''});pendingLogo=null;await saveConfig();toast('Auspiciante agregado');render();});
  document.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=async()=>{if(b.dataset.armed){S.list.splice(+b.dataset.sdel,1);await saveConfig();toast('Auspiciante quitado');render();}else{b.dataset.armed='1';b.textContent='¿Confirmar?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Quitar';}},3000);}});
  document.querySelectorAll('[data-sup]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.sup;if(i<1)return;[S.list[i-1],S.list[i]]=[S.list[i],S.list[i-1]];await saveConfig();render();});
  $('#ctaF')?.addEventListener('submit',async e=>{e.preventDefault();S.text=$('#cText').value.trim();S.whatsapp=$('#cWa').value.trim();S.email=$('#cMail').value.trim();await saveConfig();toast('Recuadro guardado');render();});
  $('#pinF')?.addEventListener('submit',async e=>{e.preventDefault();state.pin=$('#newPin').value;await saveConfig();toast('Clave cambiada');e.target.reset();});
  $('#logout')?.addEventListener('click',()=>{authed=false;try{sessionStorage.removeItem('law_auth')}catch(e){}render();});
}

/* ---------- Radio ---------- */
const audio=$('#audio');let playing=false;
try{audio.volume=parseFloat(localStorage.getItem('law_vol')??'0.9');}catch(e){audio.volume=.9;}
function setupAudio(){if(state.radio.stream&&audio.dataset.src!==state.radio.stream){const was=playing;audio.pause();audio.src=state.radio.stream;audio.dataset.src=state.radio.stream;if(was)toggleRadio(true);}}
async function toggleRadio(force){
  if(!state.radio.stream){toast('La radio aún no tiene señal configurada');return;}
  setupAudio();
  if(playing&&!force){audio.pause();playing=false;}
  else{try{audio.src=state.radio.stream;await audio.play();playing=true;}catch(e){playing=false;toast('No se pudo conectar con la señal de la radio');}}
  updateRadioUI();
}
function updateRadioUI(){
  $('#miniBtn').innerHTML=playing?ICON_PAUSE:ICON_PLAY;
  $('#miniProg').textContent=state.radio.program||'La Aurora Radio';
  if(casterOn()){$('#miniState').textContent=state.radio.onAir?'● Al aire · toca para escuchar':'Toca para escuchar';return;}
  $('#miniState').textContent=playing?'Sonando · La Aurora Radio':(state.radio.onAir?'● Al aire · toca para escuchar':'Toca para escuchar');
  const d=$('#disc');if(d){d.classList.toggle('play',playing);d.closest('.radio').classList.toggle('playing',playing);$('#bigPlay').innerHTML=playing?ICON_PAUSE:ICON_PLAY;}
}
$('#miniBtn').onclick=()=>{if(casterOn()){location.hash='#radio';}else toggleRadio();};
audio.addEventListener('error',()=>{if(playing){playing=false;updateRadioUI();toast('Se perdió la señal de la radio');}});

let casterKey='';
function mountCaster(){
  const park=$('#casterPark');if(!casterOn()){park.innerHTML='';casterKey='';return;}
  const {token,channel}=casterIds();const key=token+channel;
  let w=document.getElementById('casterWidget');
  if(!w||casterKey!==key){
    park.innerHTML='';casterKey=key;
    w=document.createElement('div');w.id='casterWidget';w.className='cstrEmbed';
    w.dataset.type='newStreamPlayer';w.dataset.publictoken=token;w.dataset.theme='light';w.dataset.color='e3342b';w.dataset.channelid=channel;w.dataset.rendered='false';
    w.setAttribute('data-publicToken',token);w.setAttribute('data-channelId',channel);
    park.appendChild(w);
    document.querySelectorAll('script[data-caster]').forEach(x=>x.remove());
    const sc=document.createElement('script');sc.src='https://cdn.cloud.caster.fm//widgets/embed.js';sc.dataset.caster='1';document.body.appendChild(sc);
  }
  const slot=$('#casterSlot');(slot||park).appendChild(w);
}

/* ---------- Artículo ---------- */
function openPost(id){
  const p=state.posts.find(x=>x.id===id);if(!p)return;const d=$('#dlg');
  d.innerHTML=`<article class="art" style="position:relative">${p.img?`<img src="${esc(p.img)}" alt="">`:''}<button class="x" aria-label="Cerrar">×</button>
    <div class="bd">${tagOf(p.cat)} <span class="meta">${new Date(p.date).toLocaleString('es-EC',{dateStyle:'long',timeStyle:'short'})}</span>
    <h1>${esc(p.title)}</h1>${p.summary?`<p style="font-size:18px;font-weight:500">${esc(p.summary)}</p>`:''}<div class="body">${esc(p.body)}</div></div></article>`;
  d.querySelector('.x').onclick=()=>d.close();d.showModal();
}
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close();});

/* ---------- Router ---------- */
function render(){
  const r=(location.hash||'#inicio').slice(1);const app=$('#app');
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===r));
  if(r==='noticias')app.innerHTML=listSection('noticias','Noticias');
  else if(r==='deportes')app.innerHTML=listSection('deportes','Deportes');
  else if(r==='envivo')app.innerHTML=liveSection(false);
  else if(r==='radio')app.innerHTML=radioSection();
  else if(r==='admin')app.innerHTML=viewAdmin();
  else app.innerHTML=viewHome();
  if(r!=='admin')app.insertAdjacentHTML('beforeend',sponsorsSection());
  // aviso EN VIVO
  $('#signal').hidden=!state.live.on;$('#signalTxt').textContent='EN VIVO · '+(state.live.title||'Transmisión');
  // enlaces sociales
  const fb=$('#lnkFb'),yt=$('#lnkYt');fb.href=state.live.fbPage||'https://facebook.com';yt.href=state.live.ytPage||'https://youtube.com';
  // eventos
  app.querySelectorAll('[data-open]').forEach(el=>{el.onclick=()=>openPost(el.dataset.open);el.onkeydown=e=>{if(e.key==='Enter')openPost(el.dataset.open);};});
  $('#bigPlay')&&($('#bigPlay').onclick=()=>toggleRadio());
  $('#vol')&&($('#vol').oninput=e=>{audio.volume=+e.target.value;try{localStorage.setItem('law_vol',e.target.value)}catch(_){} });
  if(r==='admin')bindAdmin();
  updateRadioUI();setupAudio();mountCaster();
}
addEventListener('hashchange',()=>{render();scrollTo(0,0);});
initData();
</script>
